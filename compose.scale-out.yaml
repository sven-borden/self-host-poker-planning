# An example, not the default (README, "Running several instances"): two app replicas
# behind nginx, sharing rooms through Redis. Laid over compose.yaml:
#   docker compose -f compose.yaml -f compose.scale-out.yaml up -d --build
# The same .env as compose.yaml; open BASE_URL as before (nginx answers on port 3000).
# The replicas use WebSocket only, so nginx needs no sticky sessions: each request and
# each new connection goes to either replica.

services:
  app:
    deploy:
      replicas: 2
    # Only nginx is published on the host.
    ports: !reset []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      # nginx appends X-Forwarded-For. With another proxy in front of nginx, set
      # TRUST_PROXY=2: X-Forwarded-Proto $scheme below overwrites an outer TLS proxy's value.
      TRUST_PROXY: ${TRUST_PROXY:-true}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pub/sub and short-lived command ids only: nothing to keep across a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published on the host: only the replicas reach it, on the compose network.

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "3000:3000"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx:
    content: |
      # Docker's DNS: `app` resolves to every replica, looked up again every 10 s.
      resolver 127.0.0.11 valid=10s ipv6=off;
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        "" close;
      }
      server {
        listen 3000;
        client_max_body_size 64k;
        location / {
          set $$app app;
          proxy_pass http://$$app:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_read_timeout 120s;
        }
      }
