name: CI

# Pull requests only (ADR-013 and CLAUDE.md): no push or scheduled runs. No branch filter,
# so stacked PRs run too. Docs-only changes run no job, except the design brief: its
# Tokens table is the colour contract that apps/web/src/theme/tokens.test.ts checks.
# Order matters: later patterns override earlier ones, so the brief re-enters last.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/03-design-brief.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependency audit (#36): a high or critical advisory in a production dependency
      # fails the job; when npm's audit endpoint cannot be reached it warns and passes
      # (scripts/audit.mjs). Every advisory, dev-only ones included, is listed without failing.
      - name: pnpm audit (production, high and critical fail)
        run: node scripts/audit.mjs
      - name: pnpm audit (everything, reported only)
        run: pnpm audit || true
      - run: pnpm gate

  db-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for a CI-only database, not a secret.
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: pp
          POSTGRES_DB: pp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d pp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Two server instances share rooms through it (#39, scale-out.db.test.ts). Only that
      # file reads TEST_REDIS_URL; every other test runs one instance without Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pp:pp@localhost:5432/pp_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The restart test (apps/server/src/sync/restart.db.test.ts) runs the built server.
      - run: pnpm --filter @pp/server build
      - run: pnpm test:db

  # The app in a real browser (#13, #36): Playwright against the real server, which serves
  # a fresh build with its production headers and needs the Postgres below
  # (playwright.config.ts refuses to start without DATABASE_URL).
  web-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for a CI-only database, not a secret.
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: pp
          POSTGRES_DB: pp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d pp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://pp:pp@localhost:5432/pp_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached per Playwright version; its system packages install
      # every time. A dry run of install-deps (#23) found fonts missing on ubuntu-26.04 on
      # every run, so it never saved the apt step.
      - id: playwright
        run: echo "version=$(pnpm --filter @pp/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @pp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pp/web build
      - run: pnpm --filter @pp/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/tmp/screenshots/
          retention-days: 5

  # The Docker image and compose.yaml (#11): build the image, then
  # scripts/docker-check.sh starts app and Postgres with compose and checks size (< 250 MB),
  # health, the commit, Socket.IO over WebSocket, restarts, migrations and SIGTERM. It
  # tears everything down itself.
  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node runs the smoke test only; nothing is installed on the runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: poker-planning:local
          build-args: GIT_COMMIT=${{ github.event.pull_request.head.sha }}
      - run: scripts/docker-check.sh --no-build
        env:
          GIT_COMMIT: ${{ github.event.pull_request.head.sha }}
